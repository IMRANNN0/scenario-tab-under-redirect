<!-- Embed in a page or native <dialog>. Change visible copy to the approved offer. -->
<section data-swipe aria-labelledby="swipe-title">
  <h2 id="swipe-title">Continue to the offer</h2>
  <p>Slide to continue, or use the button below.</p>
  <label for="offer-swipe">Slide to continue</label>
  <input id="offer-swipe" data-swipe-range type="range" min="0" max="100" value="0" step="1">
  <button data-swipe-continue type="button">Continue to the offer</button>
  <button data-swipe-cancel type="button">Cancel</button>
  <p data-swipe-status role="status" aria-live="polite"></p>
</section>
